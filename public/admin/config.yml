backend:
  name: github
  repo: BDME132/timpanogos-invitational
  branch: main
  # Custom auth: coaches sign in with a single shared password instead of GitHub.
  # base_url + auth_endpoint point the CMS at our Vercel function (api/oauth.js),
  # which checks ADMIN_PASSWORD and hands back a server-held GITHUB_TOKEN.
  base_url: https://www.timpinvite.com
  auth_endpoint: api/oauth

# Media uploads land in /public/ so they're served at the site root.
media_folder: public
public_folder: /

site_url: https://www.timpinvite.com
display_url: https://www.timpinvite.com

# Commit messages auto-generated by the CMS.
collections:
  # ── NEWS / ANNOUNCEMENTS ──
  - name: news
    label: News & Announcements
    label_singular: Post
    folder: src/content/news
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - { name: title,   label: Title,   widget: string  }
      - { name: date,    label: Date,    widget: datetime, default: '' }
      - { name: summary, label: Summary, widget: text,   required: false }
      - { name: draft,   label: Draft,   widget: boolean, default: false, required: false }
      - { name: body,    label: Body,    widget: markdown }

  # ── MEET DETAILS (single file) ──
  - name: site
    label: Site Content
    files:
      - name: meet
        label: Meet Details
        file: src/data/meet.json
        format: json
        fields:
          - { name: year,           label: Year,                widget: number }
          - { name: tagline,        label: Tagline,             widget: string }
          - { name: heroBadge,      label: Hero Badge,          widget: string }
          - { name: raceDate,       label: Race Date (display), widget: string }
          - { name: raceDateISO,    label: Race Date (ISO, for countdown), widget: datetime }
          - { name: raceTime,       label: Race Time,           widget: string }
          - { name: venue,          label: Venue Name,          widget: string }
          - { name: venueShort,     label: Venue (short),       widget: string }
          - { name: address,        label: Address,             widget: string }
          - { name: distance,       label: Distance,            widget: string }
          - { name: sessions,       label: Sessions,            widget: string }
          - name: registration
            label: Registration
            widget: object
            fields:
              - { name: am,                label: 'AM RunnerCard URL',  widget: string }
              - { name: pm,                label: 'PM RunnerCard URL',  widget: string }
              - { name: deadline,          label: Deadline,             widget: string }
              - { name: deadlineTime,      label: Deadline Time,        widget: string }
              - { name: sessionLimit,      label: Session Limit,        widget: string }
              - { name: entryFee,          label: Entry Fee,            widget: string }
              - { name: entryFeeSmall,     label: Entry Fee (small),    widget: string }
              - { name: entriesNote,       label: Entries Note,         widget: string }
          - name: stats
            label: Stats Bar
            widget: list
            fields:
              - { name: num,   label: Number, widget: string }
              - { name: label, label: Label,  widget: string }
          - { name: course,            label: Course Description, widget: text }
          - { name: courseMapCaption,  label: Course Map Caption, widget: string }
          - { name: awards,            label: Awards (bullets),   widget: list, field: { name: item, widget: string } }
          - name: fees
            label: Fees
            widget: object
            fields:
              - { name: standard, label: Standard Entry Text, widget: text }
              - { name: payment,  label: Payment Text,        widget: text }
          - { name: logistics, label: Parking / Logistics (bullets), widget: list, field: { name: item, widget: string } }
          - { name: about,     label: About Paragraphs, widget: list, field: { name: paragraph, widget: text } }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: director,      label: Director,        widget: string }
              - { name: phone,         label: Phone,           widget: string }
              - { name: email,         label: Email,           widget: string }
              - { name: school,        label: School,          widget: string }
              - { name: schoolAddress, label: School Address,  widget: text }
          - { name: scoreboardUrl, label: Live Scoreboard URL, widget: string }

      # ── SCHEDULE ──
      - name: schedule
        label: Race Day Schedule
        file: src/data/schedule.json
        format: json
        fields:
          - name: am
            label: AM Session
            widget: list
            fields:
              - { name: time,    label: Time,    widget: string }
              - { name: event,   label: Event,   widget: string }
              - { name: varsity, label: Varsity, widget: boolean, default: false }
          - name: pm
            label: PM Session
            widget: list
            fields:
              - { name: time,    label: Time,    widget: string }
              - { name: event,   label: Event,   widget: string }
              - { name: varsity, label: Varsity, widget: boolean, default: false }

      # ── COURSE RECORDS ──
      - name: records
        label: Course Records
        file: src/data/records.json
        format: json
        fields:
          - name: boys
            label: Boys Course Record
            widget: object
            fields:
              - { name: time,   label: Time,   widget: string }
              - { name: name,   label: Name,   widget: string }
              - { name: school, label: School, widget: string }
          - name: girls
            label: Girls Course Record
            widget: object
            fields:
              - { name: time,   label: Time,   widget: string }
              - { name: name,   label: Name,   widget: string }
              - { name: school, label: School, widget: string }

      # ── CHAMPIONS (individual + team) ──
      - name: champions
        label: Champions (year-by-year)
        file: src/data/champions.json
        format: json
        fields:
          - name: individual
            label: Individual Champions
            widget: list
            fields:
              - { name: year,          label: Year,          widget: number }
              - { name: boysWinner,    label: Boys Winner,   widget: string }
              - { name: boysSchool,    label: Boys School,   widget: string }
              - { name: girlsWinner,   label: Girls Winner,  widget: string }
              - { name: girlsSchool,   label: Girls School,  widget: string }
          - name: team
            label: Team Champions
            widget: list
            fields:
              - { name: year,  label: Year,         widget: number }
              - { name: boys,  label: Boys Team,    widget: string }
              - { name: girls, label: Girls Team,   widget: string }

      # ── NOTABLE ALUMNI ──
      - name: alumni
        label: Notable Alumni
        file: src/data/alumni.json
        format: json
        fields:
          - name: alumni
            label: Alumni (set the key 'alumni' to wrap the list)
            widget: list
            # Sveltia/Decap need a wrapper field name when the file is a raw array.
            # Use json_array trick: leave the list as the top-level value.
            fields:
              - { name: name,   label: Name,           widget: string }
              - { name: school, label: School,         widget: string }
              - { name: year,   label: Year(s),        widget: string }
              - { name: badge,  label: Badge (optional), widget: string, required: false }
              - { name: bio,    label: Bio,            widget: text }

      # ── PAST RESULTS ARCHIVE ──
      - name: results-archive
        label: Past Results Archive
        file: src/data/results-archive.json
        format: json
        fields:
          - name: years
            label: Year Links
            widget: list
            fields:
              - { name: year, label: Year,        widget: string }
              - { name: url,  label: Results URL, widget: string }
